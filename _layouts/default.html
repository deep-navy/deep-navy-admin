<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self'{% if site.runtime.api_base_url != '' %} {{ site.runtime.api_base_url | escape }}{% endif %}{% if site.runtime.cognito_domain != '' %} {{ site.runtime.cognito_domain | escape }}{% endif %}; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'none'{% if site.runtime.environment == 'production' %}; upgrade-insecure-requests{% endif %}">
    <meta http-equiv="Permissions-Policy" content="camera=(), geolocation=(), microphone=(), payment=(), usb=()">
    <meta name="theme-color" content="#04131d">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <title>{{ page.title | default: site.title }} · {{ site.title }}</title>
    <script src="{{ '/assets/js/callback-scrubber.js' | relative_url }}"></script>
    <link rel="stylesheet" href="{{ '/assets/css/admin.css' | relative_url }}">
  </head>
  <body
    data-auth-callback="{{ page.auth_callback | default: false }}"
    data-environment="{{ site.runtime.environment | escape }}"
  >
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Deep Navy Admin home">
        <span class="brand-mark" aria-hidden="true">DN</span>
        <span>
          <span class="brand-name">Deep Navy</span>
          <span class="brand-product">Admin</span>
        </span>
      </a>

      <div class="header-meta">
        <span class="environment-chip environment-chip--{{ site.runtime.environment | escape }}">
          <span class="environment-dot" aria-hidden="true"></span>
          {{ site.runtime.environment_label | default: site.runtime.environment }}
        </span>
        <div class="operator-summary" data-operator-summary hidden>
          <span data-operator-name>Authenticated operator</span>
          <span data-operator-role></span>
        </div>
        <button class="button button--quiet button--small" type="button" data-sign-out hidden>Sign out</button>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>Deep Navy internal operations</span>
      <span>Protected data is loaded only after API-verified operator access.</span>
    </footer>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true" data-toast hidden></div>
    <script src="{{ '/assets/js/runtime-config.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/admin-api-client.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/admin.js' | relative_url }}" defer></script>
  </body>
</html>
