name: Build and deploy admin shell

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # GitHub Pages has one active artifact per repository, so serialize branch deploys.
  group: admin-pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Validate development and production builds
        run: script/validate-site

  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build environment artifact
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$TARGET_BRANCH" = "main" ]; then
            export JEKYLL_ENV=production
            bundle exec jekyll build --strict_front_matter --config _config.yml,_config.production.yml --baseurl "${{ steps.pages.outputs.base_path }}"
          else
            export JEKYLL_ENV=development
            bundle exec jekyll build --strict_front_matter --config _config.yml,_config.development.yml --baseurl "${{ steps.pages.outputs.base_path }}"
          fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy branch build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
