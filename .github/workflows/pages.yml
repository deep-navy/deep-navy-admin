name: Admin site

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: admin-pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Validate contracts, browser security, and environment builds
        run: script/validate-site

  build:
    # A Pages repository has only one live deployment. Production stays
    # disabled until the custom domain and branch policy are cut over together.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Verify and build generated admin API client
        run: npm run check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Write public admin runtime configuration
        env:
          DEEP_NAVY_ENVIRONMENT: development
          # Keep generated routes and Cognito redirects on the custom domain
          # even while GitHub Pages is still provisioning its certificate.
          ADMIN_URL: https://dev.admin.deep.navy
          ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
          ADMIN_COGNITO_DOMAIN: ${{ vars.ADMIN_COGNITO_DOMAIN }}
          ADMIN_COGNITO_ISSUER: ${{ vars.ADMIN_COGNITO_ISSUER }}
          ADMIN_COGNITO_CLIENT_ID: ${{ vars.ADMIN_COGNITO_CLIENT_ID }}
          ADMIN_SESSION_MAX_AGE_SECONDS: ${{ vars.ADMIN_SESSION_MAX_AGE_SECONDS || '900' }}
          GITHUB_SHA: ${{ github.sha }}
        run: ruby scripts/write_runtime_config.rb
      - name: Build protected admin artifact
        env:
          JEKYLL_ENV: development
        run: bundle exec jekyll build --strict_front_matter --config _config.yml,_config.runtime.yml --baseurl ""
      - name: Validate rendered deployment artifact
        env:
          TARGET_ENVIRONMENT: development
          TARGET_API_ORIGIN: ${{ vars.ADMIN_API_BASE_URL }}
        run: ruby test/site_test.rb _site "$TARGET_ENVIRONMENT" "$TARGET_API_ORIGIN" ""
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
